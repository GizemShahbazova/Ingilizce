<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Life Writing Arcade</title><style>:root{font-family:'Trebuchet MS',Arial,sans-serif;color:#23345d;background:#f3f7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 10%,#fff1b5,transparent 30%),radial-gradient(circle at 90% 20%,#d6f6ed,transparent 30%),#f3f7ff}.wrap{max-width:940px;margin:auto;padding:24px}header{background:#23478b;color:white;border-radius:25px;padding:24px;box-shadow:0 10px 25px #243b6940}h1{margin:0;font-size:clamp(28px,5vw,46px)}.subtitle{margin:6px 0}.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin:20px 0}.tile{border:3px solid transparent;background:white;border-radius:18px;padding:16px;cursor:pointer;text-align:left;box-shadow:0 4px 12px #203c6b1c;font-weight:bold;color:#24345c}.tile.active{border-color:#ffbd38;background:#fff9e6}.tile .emoji{font-size:30px;display:block;margin-bottom:8px}.panel{background:white;border-radius:22px;padding:24px;box-shadow:0 8px 24px #263c6520;min-height:330px}.pill{background:#e5edff;color:#294987;border-radius:30px;padding:6px 12px;display:inline-block;font-weight:bold;font-size:13px}.task{font-size:21px;font-weight:bold;line-height:1.5;margin:16px 0}.hint{background:#fff6d8;border-left:5px solid #ffc144;border-radius:8px;padding:12px;margin:12px 0}input,textarea{width:100%;padding:14px;border:2px solid #ccd9f1;border-radius:12px;font:inherit;color:#23345d}textarea{min-height:150px;resize:vertical}button{font:inherit}.btn{border:0;border-radius:12px;background:#2554af;color:white;padding:12px 19px;font-weight:bold;cursor:pointer;margin:6px 6px 6px 0}.btn.secondary{background:#e9effb;color:#264780}.btn:disabled{opacity:.45;cursor:not-allowed}.tokens{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.token{border:2px solid #b9d4fa;background:#e9f4ff;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:bold;color:#244b80}.token:disabled{opacity:.35}.answer{min-height:65px;border:2px dashed #9eb8df;border-radius:12px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.chosen{background:#ffe6a5;border-radius:9px;padding:7px 10px;cursor:pointer}.feedback{margin:12px 0;padding:12px;border-radius:10px;font-weight:bold}.good{background:#dff8e8;color:#146039}.bad{background:#ffeded;color:#a42b32}.progress{height:12px;background:#e8edf7;border-radius:20px;overflow:hidden;margin:14px 0}.bar{height:100%;background:#56c7a3;transition:width .2s}.stats{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:10px 0}.small{font-size:13px;color:#66799d}footer{text-align:center;padding:25px;color:#526789}label{display:block;margin:12px 0 5px;font-weight:bold}.rubric{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:15px}.rubric>div{background:#edf6ff;border-radius:12px;padding:12px}.sample{background:#e8f8f3;border-radius:12px;padding:14px;white-space:pre-wrap}.hide{display:none}@media print{header,.games,.btn,.stats{display:none!important}.panel{box-shadow:none}body{background:white}}</style></head><body><div class="wrap"><header><h1>🎒 School Life Writing Arcade</h1><p class="subtitle">Grade 6 • Unit 1 • Five interactive writing games</p><span>✏️ Write • 🎯 Practise • ⭐ Improve</span></header><nav class="games" id="menu"></nav><main class="panel"><div class="stats"><span class="pill" id="gameLabel"></span><span class="pill" id="scoreLabel"></span></div><div class="progress"><div class="bar" id="bar"></div></div><div id="content"></div></main><footer>Prepared by Zeynep Gizem ŞAHBAZ</footer></div><script>
const games=[{name:'My School Day',emoji:'⏰',type:'order',intro:'Put the words in order to describe school routines.',items:[['I','get up','at seven o’clock','.'],['My first lesson','starts','at half past eight','.'],['I','usually','walk to school','with my sister','.'],['We','have lunch','at twelve o’clock','.'],['I','do my homework','before dinner','.']]},{name:'School Rules',emoji:'📚',type:'order',intro:'Build positive and negative imperative sentences.',items:[['Listen','to your teacher','carefully','.'],['Keep','your classroom','clean','.'],['Don’t','run','in the corridor','.'],['Be','kind','to your classmates','.'],['Don’t','use your phone','during lessons','.']]},{name:'Frequency Master',emoji:'📅',type:'fill',intro:'Choose the correct frequency adverb and type the complete sentence.',items:[{base:'Emma ___ does her homework. (100%)',answer:'Emma always does her homework.',word:'always'},{base:'She ___ reads books in the library. (often)',answer:'She often reads books in the library.',word:'often'},{base:'Emma ___ plays chess after school. (sometimes)',answer:'Emma sometimes plays chess after school.',word:'sometimes'},{base:'She ___ joins school ceremonies. (usually)',answer:'She usually joins school ceremonies.',word:'usually'},{base:'Emma ___ arrives late at school. (0%)',answer:'Emma never arrives late at school.',word:'never'}]},{name:'Celebration Quest',emoji:'🎉',type:'order',intro:'Create sentences about school ceremonies and celebrations.',items:[['We','celebrate','national days','at school','.'],['Students','sing','the national anthem','.'],['Our headmaster','usually','gives a speech','.'],['We','wave flags','during the ceremony','.'],['I','feel proud','on national days','.']]},{name:'Welcome to My School',emoji:'🏫',type:'write',intro:'Write a welcome letter to a new student using the writing checklist.'}];
let current=0,index=0,points=[0,0,0,0,0],done=[[],[],[],[],[]],picked=[],feedback='',finished=false;const $=id=>document.getElementById(id);const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g,'').replace(/\s+/g,' ').trim();function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function nav(){ $('menu').innerHTML=games.map((g,i)=>`<button class="tile ${current===i?'active':''}" onclick="selectGame(${i})"><span class="emoji">${g.emoji}</span>${i+1}. ${g.name}<div class="small">${done[i].length||0} completed</div></button>`).join('');}function selectGame(i){current=i;index=0;picked=[];feedback='';finished=false;render()}function render(){nav();let g=games[current];$('gameLabel').textContent=`Game ${current+1}: ${g.name}`;$('scoreLabel').textContent=`⭐ ${points[current]} points`;$('bar').style.width=(g.type==='write'?0:index/g.items.length*100)+'%';let h=`<p>${g.intro}</p>`;if(finished){$('bar').style.width='100%';h+=`<h2>🏆 Mission complete!</h2><p>You earned ${points[current]} points. Great writing practice!</p><button class="btn" onclick="restart()">Play again ↻</button><button class="btn secondary" onclick="selectGame(${(current+1)%5})">Next game →</button>`;$('content').innerHTML=h;return;}if(g.type==='write'){h+=`<div class="hint">Your letter should include: <b>there is / there are</b>, school routines, an adverb of frequency, an imperative school rule, and a celebration.</div><label>Your name</label><input id="student" placeholder="Your name"><label>Your welcome letter (at least 6 sentences)</label><textarea id="letter" placeholder="Dear New Friend,\nWelcome to our school! ..."></textarea><button class="btn" onclick="checkLetter()">Check my writing ✓</button><button class="btn secondary" onclick="printLetter()">Print my letter 🖨</button><div id="result"></div>`;$('content').innerHTML=h;return;}let item=g.items[index];h+=`<span class="small">Question ${index+1} of ${g.items.length}</span>`;if(g.type==='order'){h+=`<div class="task">Arrange the words to make a correct sentence.</div><div class="answer" id="answer">${picked.map((p,k)=>`<button class="chosen" onclick="removeToken(${k})">${escapeHTML(item[p])} ×</button>`).join('')}</div><div class="tokens">${item.map((w,i)=>`<button class="token" ${picked.includes(i)?'disabled':''} onclick="pick(${i})">${escapeHTML(w)}</button>`).join('')}</div><button class="btn" onclick="checkOrder()">Check answer ✓</button><button class="btn secondary" onclick="clearTokens()">Clear ↻</button>`;}else{h+=`<div class="task">${escapeHTML(item.base)}</div><div class="hint">Write the <b>complete sentence</b> with the correct frequency adverb.</div><input id="typed" placeholder="Write the whole sentence here"><button class="btn" onclick="checkFill()">Check answer ✓</button>`;}if(feedback)h+=feedback;h+=`<div id="after"></div>`;$('content').innerHTML=h;}function pick(i){picked.push(i);feedback='';render()}function removeToken(k){picked.splice(k,1);feedback='';render()}function clearTokens(){picked=[];feedback='';render()}function checkOrder(){const item=games[current].items[index],actual=picked.map(i=>item[i]).join(' ').replace(/\s+\./g,'.'),expected=item.join(' ').replace(/\s+\./g,'.');check(actual,expected)}function checkFill(){check($('typed').value,games[current].items[index].answer)}function check(actual,expected){const good=norm(actual)===norm(expected);if(good&&!done[current].includes(index)){points[current]+=20;done[current].push(index)}feedback=`<div class="feedback ${good?'good':'bad'}">${good?'🌟 Excellent! Correct sentence.':'💡 Not quite. Model answer: '+escapeHTML(expected)}</div><button class="btn" onclick="next()">${index===games[current].items.length-1?'Finish game':'Next question →'}</button>`;if(games[current].type==='order'){$('after').innerHTML=feedback}else{$('after').innerHTML=feedback}}function next(){if(index===games[current].items.length-1){finished=true}else{index++;picked=[];feedback=''}render()}function restart(){points[current]=0;done[current]=[];index=0;picked=[];feedback='';finished=false;render()}function checkLetter(){const s=$('letter').value.trim(),sentences=(s.match(/[.!?](?=\s|$)/g)||[]).length;const tests=[['At least 6 sentences',sentences>=6],['There is / There are',/\bthere (is|are)\b/i.test(s)],['School routines',/\b(walk|go|start|study|read|play|have|do|learn|listen|arrive)\b/i.test(s)],['Adverb of frequency',/\b(always|usually|often|sometimes|never)\b/i.test(s)],['School rule',/\b(don't|do not|please|keep|listen|follow|be kind)\b/i.test(s)],['Celebration',/\b(ceremony|celebrate|celebration|anthem|national day|flag|parade|festival)\b/i.test(s)]];const count=tests.filter(x=>x[1]).length;points[current]=count*10;done[current]=tests.filter(x=>x[1]).map((_,i)=>i);$('scoreLabel').textContent=`⭐ ${points[current]} points`;$('bar').style.width=count/6*100+'%';$('result').innerHTML=`<h3>${count===6?'🌟 All writing goals achieved!':'Your writing checklist'}</h3><div class="rubric">${tests.map(x=>`<div>${x[1]?'✅':'⬜'} ${x[0]}</div>`).join('')}</div><p class="small">This automatic checklist checks for features, not full grammar accuracy. Ask your teacher to review your writing.</p>`;}function printLetter(){window.print()}render();</script></body></html>
