name: GitHub Pages'e Yayınla

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v6
      - name: PDF dosyalarını siteye ekle
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cp -- index.html app.js styles.css site/
          for pdf in ./*.pdf; do
            cp -- "$pdf" site/
          done
          test -s site/ingilizce-dersi-6sinif-ders-kitabi.pdf
          test -s site/ingilizce-dersi-6sinif-calisma-kitabi.pdf
      - name: GitHub Pages'i hazırla
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Site dosyalarını yükle
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - name: Siteyi yayınla
        id: deployment
        uses: actions/deploy-pages@v4
