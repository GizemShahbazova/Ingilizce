<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar Quest | 6th Grade English</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#e0f2fe,#f5f3ff);font-family:system-ui,Arial,sans-serif;color:#172554}.wrap{max-width:850px;margin:35px auto;padding:30px;background:white;border-radius:24px;box-shadow:0 12px 45px #1e3a8a22}h1{margin:0 0 8px;font-size:2rem}.tag{color:#64748b;margin-bottom:22px}.passage,.card{background:#eff6ff;border-left:5px solid #2563eb;padding:20px;border-radius:12px;line-height:1.7;margin:18px 0}.question{border:1px solid #dbeafe;border-radius:14px;padding:18px;margin:15px 0}.question h3{margin:0 0 12px;font-size:1.05rem}.choice{display:block;width:100%;text-align:left;background:#f8fafc;border:2px solid #e2e8f0;border-radius:10px;padding:13px;margin:8px 0;font-size:1rem;cursor:pointer}.choice:hover{background:#dbeafe}.choice.selected{border-color:#2563eb;background:#dbeafe}.choice.correct{border-color:#16a34a;background:#dcfce7}.choice.wrong{border-color:#dc2626;background:#fee2e2}button.action{border:0;background:#2563eb;color:white;padding:13px 20px;border-radius:12px;cursor:pointer;font-weight:700;margin:8px 8px 8px 0}button.action.secondary{background:#475569}button:disabled{opacity:.5;cursor:not-allowed}#feedback{font-weight:700;font-size:1.15rem;margin:14px 0}textarea{width:100%;min-height:190px;padding:15px;border:2px solid #cbd5e1;border-radius:12px;font:1rem/1.6 system-ui}.check{display:block;margin:12px 0}.footer{color:#64748b;font-size:.85rem;margin-top:25px}@media(max-width:600px){.wrap{margin:8px;padding:18px}h1{font-size:1.5rem}}</style></head><body><main class="wrap"><h1>🎮 Grammar Quest</h1><div class="tag">6th Grade English · School Life · ENG.6.1.G1</div><p>Choose the correct grammar form.</p><div id="questions"></div><button class="action" id="check">Check answers</button><button class="action secondary" id="retry">Play again</button><div id="feedback" aria-live="polite"></div><script>
const questions=[["My brother ___ English every day.", ["study", "studies", "studying"], 1], ["We ___ play chess after school.", ["often", "are often", "often are"], 0], ["There ___ three windows in our classroom.", ["is", "am", "are"], 2], ["This is ___ orange notebook.", ["an", "a", "the"], 0], ["My friend is Ayşe. ___ is very kind.", ["Her", "She", "Hers"], 1], ["I talk to my classmates. I help ___ every day.", ["they", "their", "them"], 2], ["___ your books, please!", ["Open", "Opens", "Opening"], 0], ["We always keep ___ classroom clean.", ["a", "our", "us"], 1]];let selected={};let checked=false;const holder=document.getElementById('questions');
function render(){holder.innerHTML='';questions.forEach(([q,opts,correct],i)=>{let block=document.createElement('section');block.className='question';let heading=document.createElement('h3');heading.textContent=(i+1)+'. '+q;block.append(heading);opts.forEach((opt,j)=>{let b=document.createElement('button');b.className='choice'+(selected[i]===j?' selected':'')+(checked?(j===correct?' correct':selected[i]===j?' wrong':''):'');b.textContent=String.fromCharCode(65+j)+') '+opt;b.disabled=checked;b.onclick=()=>{selected[i]=j;render()};block.append(b)});holder.append(block)})}
document.getElementById('check').onclick=()=>{if(Object.keys(selected).length!==questions.length){document.getElementById('feedback').textContent='Please answer all questions first.';return}checked=true;render();let score=questions.filter((q,i)=>selected[i]===q[2]).length;document.getElementById('feedback').textContent='Your score: '+score+' / '+questions.length+' — '+(score===questions.length?'Excellent!':'Keep practising!')};
document.getElementById('retry').onclick=()=>{selected={};checked=false;document.getElementById('feedback').textContent='';render()};render();</script><div class="footer">Exam preparation practice · Original questions · Works offline</div></main></body></html>
