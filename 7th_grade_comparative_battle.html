<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>⚡ Comparative Battle</title><style>
:root{--accent:#db2777}*{box-sizing:border-box}body{font-family:system-ui,Arial,sans-serif;background:linear-gradient(130deg,#eef2ff,#f0fdfa);color:#192338;margin:0;padding:20px;min-height:100vh;display:grid;place-items:center}main{width:min(100%,760px);background:white;border-radius:24px;padding:clamp(20px,5vw,36px);box-shadow:0 20px 65px #1e293b20}h1{font-size:clamp(24px,5vw,34px);margin:0 0 8px}.muted{color:#64748b}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}button{cursor:pointer;font:inherit;border-radius:13px;padding:14px;border:2px solid #e2e8f0;background:#fff;text-align:left;color:inherit}button:hover:not(:disabled){border-color:var(--accent)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.level{text-align:center;font-weight:750}.level.active,.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary{display:inline-block;text-align:center;font-weight:700;margin-top:14px}.choices{display:grid;gap:10px;margin:18px 0}.correct{background:#dcfce7!important;border-color:#16a34a!important}.wrong{background:#fee2e2!important;border-color:#dc2626!important}.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-weight:700}.bar{height:11px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin:18px 0}#fill{height:100%;width:0;background:var(--accent);transition:width .25s}#question{font-size:1.15rem;font-weight:700;white-space:pre-line;line-height:1.6}#feedback{white-space:pre-line;line-height:1.5;font-weight:600}.hidden{display:none}.chip{font-size:.82rem;background:#f1f5f9;border-radius:20px;padding:5px 10px}footer{margin-top:22px;font-size:.85rem;color:#64748b}@media(max-width:480px){.levels{grid-template-columns:1fr}}
.welcome{background:#f8fafc;border:1px solid #e2e8f0;padding:18px;border-radius:16px;margin:14px 0}.welcome p{line-height:1.6}.achievement{font-size:2rem;font-weight:800;text-align:center;padding:15px;margin:12px 0;border-radius:16px;background:linear-gradient(115deg,#fef3c7,#dbeafe)}#gameTop,#progressBar{display:none}#finish{text-align:center}.level{min-height:70px}</style></head><body><main><h1>⚡ Comparative Battle</h1><p class="muted">Grade 7 · MEB Unit 1 &amp; Unit 2 · Choose your level!</p><div class="levels" id="levels"><button class="level active" data-level="0">🌱 Easy</button><button class="level" data-level="1">🌟 Medium</button><button class="level" data-level="2">🧠 Hard<br><small>Skill-based</small></button></div><div id="welcome" class="welcome"><p>Choose your challenge level, then press Start Game!</p><p>🌱 Easy: Vocabulary · 🌟 Medium: Grammar · 🧠 Hard: Reading & reasoning</p><button class="primary" id="begin">▶ Start Game</button></div><div class="top" id="gameTop"><span id="counter"></span><span id="score"></span><span id="label" class="chip"></span></div><div class="bar" id="progressBar" role="progressbar" aria-label="Game progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill"></div></div><section id="play" class="hidden"><div id="question" aria-live="polite"></div><div id="choices" class="choices"></div><div id="feedback" role="status"></div><button id="next" class="primary hidden">Next →</button></section><section id="finish" class="hidden"><div id="badge" class="achievement" role="status"></div><h2 id="result"></h2><p id="summary"></p><button class="primary" id="again">Play this level again ↻</button> <button class="primary" id="change-level">Choose another level</button></section><footer>Original practice questions aligned to MEB Grade 7 English Units 1–2. No sign-in or internet needed.</footer></main><script>
const all=[{"q": "tall → ?", "a": "taller", "options": ["taller", "more tall", "tallest", "tallier"], "why": "Add -er."}, {"q": "good → ?", "a": "better", "options": ["better", "gooder", "more good", "best"], "why": "Good has an irregular comparative."}, {"q": "heavy → ?", "a": "heavier", "options": ["heavier", "heavyer", "more heavy", "heaviest"], "why": "Change -y to -ier."}, {"q": "thin → ?", "a": "thinner", "options": ["thinner", "thiner", "more thin", "thinnest"], "why": "Double the final consonant."}, {"q": "outgoing → ?", "a": "more outgoing", "options": ["more outgoing", "outgoinger", "outgoingest", "most outgoing"], "why": "Use more with outgoing."}, {"q": "bad → ?", "a": "worse", "options": ["worse", "badder", "more bad", "worst"], "why": "Bad has an irregular comparative."}, {"q": "Aylin is 160 cm. Eda is 170 cm. Eda is ... Aylin.", "a": "taller than", "options": ["taller than", "tall than", "more tall than", "the tallest than"], "why": "170 is greater than 160."}, {"q": "Which sentence is correct?", "a": "My sister is more generous than me.", "options": ["My sister is more generous than me.", "My sister is generouser than me.", "My sister more generous than me.", "My sister is most generous than me."], "why": "Use more + long adjective + than."}, {"q": "fat → comparative", "a": "fatter", "options": ["fatter", "fater", "more fat", "fatest"], "why": "Double t before -er."}, {"q": "tidy → comparative", "a": "tidier", "options": ["tidier", "tidyer", "more tidy", "tidiest"], "why": "Change y to i and add -er."}, {"q": "Which is correct?", "a": "My result is better than last week.", "options": ["My result is better than last week.", "My result is gooder than last week.", "My result better than last week.", "My result is best than last week."], "why": "Better is the comparative of good."}, {"q": "Which is correct?", "a": "Leyla is slimmer than her brother.", "options": ["Leyla is slimmer than her brother.", "Leyla is slimer than her brother.", "Leyla is more slim than her brother.", "Leyla slimmer her brother."], "why": "Slim → slimmer."}, {"q": "HEIGHT CHART:\nMert 148 cm | Asya 156 cm | Deniz 163 cm\nWhich sentence is TRUE?", "a": "Deniz is taller than Asya.", "options": ["Deniz is taller than Asya.", "Mert is taller than Deniz.", "Asya is shorter than Mert.", "Deniz is shorter than Asya."], "why": "163 > 156 > 148."}, {"q": "BOOK CLUB: Eva reads 5 books, Mia reads 8, and Ada reads 3 in a month. Which comparison is supported?", "a": "Mia reads more books than Eva.", "options": ["Mia reads more books than Eva.", "Ada reads more books than Eva.", "Eva reads fewer books than Ada.", "Mia reads fewer books than Ada."], "why": "8 is greater than 5."}, {"q": "EDIT THE SCHOOL POSTER:\n“Tom is more tall than Jack, but Jack is more outgoing than Tom.”\nWhat is the BEST correction?", "a": "Tom is taller than Jack, but Jack is more outgoing than Tom.", "options": ["Tom is taller than Jack, but Jack is more outgoing than Tom.", "Tom is tallest than Jack, but Jack is outgoinger than Tom.", "Tom taller Jack, but Jack outgoing than Tom.", "Tom is more taller than Jack, but Jack is outgoingest."], "why": "Tall → taller; outgoing → more outgoing."}, {"q": "PROFILE DATA:\nElif: 13 years old, 154 cm, 45 kg\nMaya: 12 years old, 159 cm, 49 kg\nWhich TWO statements are TRUE?", "a": "Elif is older; Maya is taller.", "options": ["Elif is older; Maya is taller.", "Maya is older; Elif is taller.", "Elif is taller; Maya is lighter.", "They are the same age; Elif is heavier."], "why": "13 > 12 and 159 > 154."}, {"q": "CLASS SURVEY:\nArda: 7 friends | Selin: 12 friends | Naz: 9 friends.\nWhich sentence is NOT supported by the numbers?", "a": "Selin is more generous than Arda.", "options": ["Selin is more generous than Arda.", "Selin has more friends than Arda.", "Naz has fewer friends than Selin.", "Arda has fewer friends than Naz."], "why": "Friend counts do not establish generosity."}, {"q": "COMPARATIVE CHECK:\nA writer wants to compare two students’ personality without using appearance. Which sentence fits?", "a": "Lena is more easy-going than Nina.", "options": ["Lena is more easy-going than Nina.", "Lena is taller than Nina.", "Lena has curlier hair than Nina.", "Lena has greener eyes than Nina."], "why": "Easy-going describes personality, not appearance."}];let level=0,items=[],index=0,score=0,locked=false;const $=id=>document.getElementById(id);function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function start(l){level=l;document.querySelectorAll('.level').forEach((b,i)=>b.classList.toggle('active',i===l));items=shuffle(all.slice(l*6,l*6+6)).map(x=>({...x,options:shuffle(x.options)}));index=0;score=0;$('finish').classList.add('hidden');$('welcome').classList.add('hidden');$('levels').classList.add('hidden');$('gameTop').style.display='flex';$('progressBar').style.display='block';$('play').classList.remove('hidden');render()}function render(){locked=false;let x=items[index];$('counter').textContent=`Question ${index+1} / ${items.length}`;$('score').textContent=`⭐ ${score} / ${items.length*10}`;$('label').textContent=['Easy','Medium','Hard · Skill-based'][level];$('fill').style.width=(index/items.length*100)+'%';$('progressBar').setAttribute('aria-valuenow',String(Math.round(index/items.length*100)));$('question').textContent=x.q;$('feedback').textContent='';$('next').classList.add('hidden');$('choices').replaceChildren();x.options.forEach(o=>{let b=document.createElement('button');b.textContent=o;b.onclick=()=>choose(b,o);$('choices').append(b)})}function choose(btn,o){if(locked)return;locked=true;let x=items[index],ok=o===x.a;if(ok)score+=10;document.querySelectorAll('#choices button').forEach(b=>{b.disabled=true;if(b.textContent===x.a)b.classList.add('correct');else if(b===btn)b.classList.add('wrong')});$('feedback').textContent=(ok?'✅ Correct! +10 points':'❌ Correct answer: '+x.a)+'\n💡 '+x.why;$('score').textContent=`⭐ ${score} / ${items.length*10}`;$('next').textContent=index===items.length-1?'See results →':'Next question →';$('next').classList.remove('hidden')}$('next').onclick=()=>{index++;if(index>=items.length){$('play').classList.add('hidden');$('finish').classList.remove('hidden');$('fill').style.width='100%';$('progressBar').setAttribute('aria-valuenow','100');$('badge').textContent=score===60?'🥇 GOLD CHAMPION':score>=40?'🥈 SILVER STAR':score>=20?'🥉 BRONZE EXPLORER':'🌱 BRAVE BEGINNER';$('result').textContent=score>=50?'🏆 Excellent!':score>=30?'🌟 Good job!':'💪 Keep practising!';$('summary').textContent=`${['Easy','Medium','Hard'][level]} level: ${score} / ${items.length*10} points.`}else render()};document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{level=Number(b.dataset.level);document.querySelectorAll('.level').forEach((el,i)=>el.classList.toggle('active',i===level));});$('begin').onclick=()=>start(level);$('again').onclick=()=>start(level);$('change-level').onclick=()=>{$('finish').classList.add('hidden');$('play').classList.add('hidden');$('welcome').classList.remove('hidden');$('levels').classList.remove('hidden');$('gameTop').style.display='none';$('progressBar').style.display='none';};$('finish').classList.add('hidden');
</script></body></html>
