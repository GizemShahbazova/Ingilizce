<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🏆 English Adventure</title><style>
:root{--accent:#2563eb}*{box-sizing:border-box}body{font-family:system-ui,Arial,sans-serif;background:linear-gradient(130deg,#eef2ff,#f0fdfa);color:#192338;margin:0;padding:20px;min-height:100vh;display:grid;place-items:center}main{width:min(100%,760px);background:white;border-radius:24px;padding:clamp(20px,5vw,36px);box-shadow:0 20px 65px #1e293b20}h1{font-size:clamp(24px,5vw,34px);margin:0 0 8px}.muted{color:#64748b}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}button{cursor:pointer;font:inherit;border-radius:13px;padding:14px;border:2px solid #e2e8f0;background:#fff;text-align:left;color:inherit}button:hover:not(:disabled){border-color:var(--accent)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.level{text-align:center;font-weight:750}.level.active,.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary{display:inline-block;text-align:center;font-weight:700;margin-top:14px}.choices{display:grid;gap:10px;margin:18px 0}.correct{background:#dcfce7!important;border-color:#16a34a!important}.wrong{background:#fee2e2!important;border-color:#dc2626!important}.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-weight:700}.bar{height:11px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin:18px 0}#fill{height:100%;width:0;background:var(--accent);transition:width .25s}#question{font-size:1.15rem;font-weight:700;white-space:pre-line;line-height:1.6}#feedback{white-space:pre-line;line-height:1.5;font-weight:600}.hidden{display:none}.chip{font-size:.82rem;background:#f1f5f9;border-radius:20px;padding:5px 10px}footer{margin-top:22px;font-size:.85rem;color:#64748b}@media(max-width:480px){.levels{grid-template-columns:1fr}}
.welcome{background:#f8fafc;border:1px solid #e2e8f0;padding:18px;border-radius:16px;margin:14px 0}.welcome p{line-height:1.6}.achievement{font-size:2rem;font-weight:800;text-align:center;padding:15px;margin:12px 0;border-radius:16px;background:linear-gradient(115deg,#fef3c7,#dbeafe)}#gameTop,#progressBar{display:none}#finish{text-align:center}.level{min-height:70px}</style></head><body><main><h1>🏆 English Adventure</h1><p class="muted">Grade 7 · MEB Unit 1 &amp; Unit 2 · Choose your level!</p><div class="levels" id="levels"><button class="level active" data-level="0">🌱 Easy</button><button class="level" data-level="1">🌟 Medium</button><button class="level" data-level="2">🧠 Hard<br><small>Skill-based</small></button></div><div id="welcome" class="welcome"><p>Choose your challenge level, then press Start Game!</p><p>🌱 Easy: Vocabulary · 🌟 Medium: Grammar · 🧠 Hard: Reading & reasoning</p><button class="primary" id="begin">▶ Start Game</button></div><div class="top" id="gameTop"><span id="counter"></span><span id="score"></span><span id="label" class="chip"></span></div><div class="bar" id="progressBar" role="progressbar" aria-label="Game progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill"></div></div><section id="play" class="hidden"><div id="question" aria-live="polite"></div><div id="choices" class="choices"></div><div id="feedback" role="status"></div><button id="next" class="primary hidden">Next →</button></section><section id="finish" class="hidden"><div id="badge" class="achievement" role="status"></div><h2 id="result"></h2><p id="summary"></p><button class="primary" id="again">Play this level again ↻</button> <button class="primary" id="change-level">Choose another level</button></section><footer>Original practice questions aligned to MEB Grade 7 English Units 1–2. No sign-in or internet needed.</footer></main><script>
const all=[{"q": "Which word describes personality?", "a": "honest", "options": ["honest", "curly", "tall", "slim"], "why": "Honest is a character trait."}, {"q": "Which word describes hair?", "a": "wavy", "options": ["wavy", "generous", "punctual", "outgoing"], "why": "Wavy describes hair."}, {"q": "Which sport uses arrows?", "a": "archery", "options": ["archery", "boxing", "cycling", "diving"], "why": "Archery uses arrows."}, {"q": "What is the comparative of smart?", "a": "smarter", "options": ["smarter", "more smart", "smartest", "smartier"], "why": "Smart → smarter."}, {"q": "How often = ?", "a": "frequency", "options": ["frequency", "appearance", "personality", "age"], "why": "How often asks about frequency."}, {"q": "Which word means not at any time?", "a": "never", "options": ["never", "usually", "often", "always"], "why": "Never = 0%."}, {"q": "Which pair is correct?", "a": "punctual = on time", "options": ["punctual = on time", "generous = selfish", "outgoing = shy", "clumsy = careful"], "why": "Punctual means on time."}, {"q": "Which sentence is correct?", "a": "Derya is more outgoing than Melis.", "options": ["Derya is more outgoing than Melis.", "Derya is outgoinger than Melis.", "Derya more outgoing Melis.", "Derya is outgoingest than Melis."], "why": "Use more outgoing than."}, {"q": "Which question asks about appearance?", "a": "What does he look like?", "options": ["What does he look like?", "What is he like?", "How often does he train?", "What sport does he play?"], "why": "Look like asks about appearance."}, {"q": "Which sentence is correct?", "a": "He plays tennis twice a week.", "options": ["He plays tennis twice a week.", "He play tennis twice a week.", "He plays tennis twice a weeks.", "He twice a week plays tennis is."], "why": "He plays; twice a week."}, {"q": "Which item is for archery?", "a": "target", "options": ["target", "boxing gloves", "bicycle", "skis"], "why": "Archers aim at a target."}, {"q": "Which statement is correct?", "a": "My brother is taller than me.", "options": ["My brother is taller than me.", "My brother is more tall than me.", "My brother taller me.", "My brother is tallest than me."], "why": "Use taller than."}, {"q": "STUDENT PROFILES:\nArzu: 160 cm, generous, trains 2 times/week\nBora: 170 cm, selfish, trains 4 times/week\nWhich statement is supported?", "a": "Bora is taller and trains more often than Arzu.", "options": ["Bora is taller and trains more often than Arzu.", "Arzu is taller than Bora.", "Bora is more generous than Arzu.", "Arzu trains more often than Bora."], "why": "170 > 160; 4 > 2."}, {"q": "SPORTS DAY NOTICE:\n“We need a punctual student to organise the archery equipment. The event starts at 9:00.”\nWhich applicant is the best fit?\nA: arrives at 8:45, knows bows and arrows\nB: arrives at 9:30, knows rackets\nC: arrives at 9:10, knows bicycles", "a": "Applicant A", "options": ["Applicant A", "Applicant B", "Applicant C", "All applicants"], "why": "A arrives early and knows archery equipment."}, {"q": "READ THE BLOG:\n“Yusuf has curly hair and is very outgoing. He usually plays volleyball on weekends. His sister is shyer than him.”\nWhich statement is NOT supported?", "a": "Yusuf is taller than his sister.", "options": ["Yusuf is taller than his sister.", "Yusuf has curly hair.", "Yusuf is outgoing.", "Yusuf usually plays volleyball on weekends."], "why": "No height data is given."}, {"q": "CLASS SCHEDULE:\nAysel: swimming Mon, Wed, Fri\nKaan: cycling Sat, Sun\nWhich sentence is accurate?", "a": "Aysel swims three times a week; Kaan cycles twice a week.", "options": ["Aysel swims three times a week; Kaan cycles twice a week.", "Aysel swims twice a week; Kaan cycles three times a week.", "They both train every day.", "Kaan never cycles."], "why": "Three days vs two days."}, {"q": "SCHOOL MAGAZINE DRAFT:\n“Ela has long straight hair. She is honest. She trains two times a week.”\nWhich heading matches ALL the information?", "a": "Appearance, personality and sports routines", "options": ["Appearance, personality and sports routines", "Only sports equipment", "Only comparisons", "Only school subjects"], "why": "All three topics appear in the draft."}, {"q": "TWO-UNIT CHALLENGE:\n“Naz is 155 cm; Ece is 165 cm. Naz always arrives on time. Ece trains on Mondays and Fridays.”\nWhich combined statement is correct?", "a": "Ece is taller; Naz is punctual; Ece trains twice a week.", "options": ["Ece is taller; Naz is punctual; Ece trains twice a week.", "Naz is taller; Ece is selfish; Ece trains daily.", "Ece is shorter; Naz is clumsy; Ece never trains.", "Naz is taller; Naz is shy; Ece trains once a week."], "why": "Compare heights, infer punctuality and count training days."}];let level=0,items=[],index=0,score=0,locked=false;const $=id=>document.getElementById(id);function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function start(l){level=l;document.querySelectorAll('.level').forEach((b,i)=>b.classList.toggle('active',i===l));items=shuffle(all.slice(l*6,l*6+6)).map(x=>({...x,options:shuffle(x.options)}));index=0;score=0;$('finish').classList.add('hidden');$('welcome').classList.add('hidden');$('levels').classList.add('hidden');$('gameTop').style.display='flex';$('progressBar').style.display='block';$('play').classList.remove('hidden');render()}function render(){locked=false;let x=items[index];$('counter').textContent=`Question ${index+1} / ${items.length}`;$('score').textContent=`⭐ ${score} / ${items.length*10}`;$('label').textContent=['Easy','Medium','Hard · Skill-based'][level];$('fill').style.width=(index/items.length*100)+'%';$('progressBar').setAttribute('aria-valuenow',String(Math.round(index/items.length*100)));$('question').textContent=x.q;$('feedback').textContent='';$('next').classList.add('hidden');$('choices').replaceChildren();x.options.forEach(o=>{let b=document.createElement('button');b.textContent=o;b.onclick=()=>choose(b,o);$('choices').append(b)})}function choose(btn,o){if(locked)return;locked=true;let x=items[index],ok=o===x.a;if(ok)score+=10;document.querySelectorAll('#choices button').forEach(b=>{b.disabled=true;if(b.textContent===x.a)b.classList.add('correct');else if(b===btn)b.classList.add('wrong')});$('feedback').textContent=(ok?'✅ Correct! +10 points':'❌ Correct answer: '+x.a)+'\n💡 '+x.why;$('score').textContent=`⭐ ${score} / ${items.length*10}`;$('next').textContent=index===items.length-1?'See results →':'Next question →';$('next').classList.remove('hidden')}$('next').onclick=()=>{index++;if(index>=items.length){$('play').classList.add('hidden');$('finish').classList.remove('hidden');$('fill').style.width='100%';$('progressBar').setAttribute('aria-valuenow','100');$('badge').textContent=score===60?'🥇 GOLD CHAMPION':score>=40?'🥈 SILVER STAR':score>=20?'🥉 BRONZE EXPLORER':'🌱 BRAVE BEGINNER';$('result').textContent=score>=50?'🏆 Excellent!':score>=30?'🌟 Good job!':'💪 Keep practising!';$('summary').textContent=`${['Easy','Medium','Hard'][level]} level: ${score} / ${items.length*10} points.`}else render()};document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{level=Number(b.dataset.level);document.querySelectorAll('.level').forEach((el,i)=>el.classList.toggle('active',i===level));});$('begin').onclick=()=>start(level);$('again').onclick=()=>start(level);$('change-level').onclick=()=>{$('finish').classList.add('hidden');$('play').classList.add('hidden');$('welcome').classList.remove('hidden');$('levels').classList.remove('hidden');$('gameTop').style.display='none';$('progressBar').style.display='none';};$('finish').classList.add('hidden');
</script></body></html>
