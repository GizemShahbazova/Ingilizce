<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🎯 How Often Challenge</title><style>
:root{--accent:#ea580c}*{box-sizing:border-box}body{font-family:system-ui,Arial,sans-serif;background:linear-gradient(130deg,#eef2ff,#f0fdfa);color:#192338;margin:0;padding:20px;min-height:100vh;display:grid;place-items:center}main{width:min(100%,760px);background:white;border-radius:24px;padding:clamp(20px,5vw,36px);box-shadow:0 20px 65px #1e293b20}h1{font-size:clamp(24px,5vw,34px);margin:0 0 8px}.muted{color:#64748b}.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}button{cursor:pointer;font:inherit;border-radius:13px;padding:14px;border:2px solid #e2e8f0;background:#fff;text-align:left;color:inherit}button:hover:not(:disabled){border-color:var(--accent)}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}.level{text-align:center;font-weight:750}.level.active,.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary{display:inline-block;text-align:center;font-weight:700;margin-top:14px}.choices{display:grid;gap:10px;margin:18px 0}.correct{background:#dcfce7!important;border-color:#16a34a!important}.wrong{background:#fee2e2!important;border-color:#dc2626!important}.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-weight:700}.bar{height:11px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin:18px 0}#fill{height:100%;width:0;background:var(--accent);transition:width .25s}#question{font-size:1.15rem;font-weight:700;white-space:pre-line;line-height:1.6}#feedback{white-space:pre-line;line-height:1.5;font-weight:600}.hidden{display:none}.chip{font-size:.82rem;background:#f1f5f9;border-radius:20px;padding:5px 10px}footer{margin-top:22px;font-size:.85rem;color:#64748b}@media(max-width:480px){.levels{grid-template-columns:1fr}}
.welcome{background:#f8fafc;border:1px solid #e2e8f0;padding:18px;border-radius:16px;margin:14px 0}.welcome p{line-height:1.6}.achievement{font-size:2rem;font-weight:800;text-align:center;padding:15px;margin:12px 0;border-radius:16px;background:linear-gradient(115deg,#fef3c7,#dbeafe)}#gameTop,#progressBar{display:none}#finish{text-align:center}.level{min-height:70px}</style></head><body><main><h1>🎯 How Often Challenge</h1><p class="muted">Grade 7 · MEB Unit 1 &amp; Unit 2 · Choose your level!</p><div class="levels" id="levels"><button class="level active" data-level="0">🌱 Easy</button><button class="level" data-level="1">🌟 Medium</button><button class="level" data-level="2">🧠 Hard<br><small>Skill-based</small></button></div><div id="welcome" class="welcome"><p>Choose your challenge level, then press Start Game!</p><p>🌱 Easy: Vocabulary · 🌟 Medium: Grammar · 🧠 Hard: Reading & reasoning</p><button class="primary" id="begin">▶ Start Game</button></div><div class="top" id="gameTop"><span id="counter"></span><span id="score"></span><span id="label" class="chip"></span></div><div class="bar" id="progressBar" role="progressbar" aria-label="Game progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="fill"></div></div><section id="play" class="hidden"><div id="question" aria-live="polite"></div><div id="choices" class="choices"></div><div id="feedback" role="status"></div><button id="next" class="primary hidden">Next →</button></section><section id="finish" class="hidden"><div id="badge" class="achievement" role="status"></div><h2 id="result"></h2><p id="summary"></p><button class="primary" id="again">Play this level again ↻</button> <button class="primary" id="change-level">Choose another level</button></section><footer>Original practice questions aligned to MEB Grade 7 English Units 1–2. No sign-in or internet needed.</footer></main><script>
const all=[{"q": "0% frequency means ...", "a": "never", "options": ["never", "always", "usually", "often"], "why": "Never means 0%."}, {"q": "100% frequency means ...", "a": "always", "options": ["always", "sometimes", "rarely", "never"], "why": "Always means every time."}, {"q": "Two times a week = ...", "a": "twice a week", "options": ["twice a week", "once a week", "twice a day", "three times a week"], "why": "Twice means two times."}, {"q": "Which question asks about frequency?", "a": "How often do you train?", "options": ["How often do you train?", "What do you look like?", "How old are you?", "Where is your school?"], "why": "How often asks about frequency."}, {"q": "Which word shows frequency?", "a": "usually", "options": ["usually", "tall", "generous", "curly"], "why": "Usually is an adverb of frequency."}, {"q": "One time every day = ...", "a": "once a day", "options": ["once a day", "twice a day", "once a year", "never"], "why": "Once means one time."}, {"q": "Choose the correct sentence.", "a": "She usually plays volleyball.", "options": ["She usually plays volleyball.", "She plays usually volleyball.", "She usually play volleyball.", "She play usually volleyball."], "why": "Frequency adverbs usually go before the main verb."}, {"q": "Choose the correct sentence.", "a": "He never eats junk food.", "options": ["He never eats junk food.", "He eats never junk food.", "He never eat junk food.", "He does never eats junk food."], "why": "He + eats; never before the verb."}, {"q": "Which sentence is correct?", "a": "They go jogging three times a week.", "options": ["They go jogging three times a week.", "They go jogging three time a week.", "They goes jogging three times a week.", "They go jogging third times a week."], "why": "Use times and the base verb with they."}, {"q": "Answer: “How often does Ali train?”\nAli trains on Monday, Wednesday and Friday.", "a": "Three times a week.", "options": ["Three times a week.", "Once a week.", "Twice a week.", "Every day."], "why": "Three training days = three times."}, {"q": "Choose the correct question.", "a": "How often does she go swimming?", "options": ["How often does she go swimming?", "How often she goes swimming?", "How often does she goes swimming?", "How often do she go swimming?"], "why": "Does + subject + base verb."}, {"q": "Which sentence uses the adverb correctly?", "a": "My brother is always active.", "options": ["My brother is always active.", "My brother always is active.", "My brother is active always every.", "My brother are always active."], "why": "After be: is always."}, {"q": "TRAINING CALENDAR:\nMon ✓ | Tue – | Wed ✓ | Thu – | Fri ✓ | Sat – | Sun –\nWhich sentence describes this schedule?", "a": "I train three times a week.", "options": ["I train three times a week.", "I train twice a week.", "I train every day.", "I never train."], "why": "Three check marks = three sessions."}, {"q": "READ THE ROUTINES:\nLina: I go jogging every morning.\nKerem: I go jogging on Saturdays only.\nWhich statement is supported?", "a": "Lina goes jogging more often than Kerem.", "options": ["Lina goes jogging more often than Kerem.", "Kerem never goes jogging.", "Lina goes jogging once a week.", "They go jogging equally often."], "why": "Every day is more frequent than once a week."}, {"q": "SPORTS BLOG:\n“Eren ___ (not / eat) junk food. He ___ (train) twice a week.”\nChoose the correct pair.", "a": "does not eat / trains", "options": ["does not eat / trains", "does not eats / train", "do not eat / trains", "does not eat / train"], "why": "Does not + base verb; he trains."}, {"q": "SURVEY RESULTS:\n20 students: 8 always exercise, 6 often exercise, 4 sometimes exercise, 2 never exercise.\nWhich statement is TRUE?", "a": "More students always exercise than never exercise.", "options": ["More students always exercise than never exercise.", "Most students never exercise.", "Exactly 6 students sometimes exercise.", "All students exercise every day."], "why": "8 always vs 2 never."}, {"q": "COACH’S MESSAGE:\n“We train on Tuesdays and Thursdays. We never train on Sundays.”\nWhich reply is accurate?", "a": "You train twice a week and never on Sundays.", "options": ["You train twice a week and never on Sundays.", "You train three times a week.", "You always train on Sundays.", "You train once a month."], "why": "Tuesday and Thursday = twice weekly."}, {"q": "ERROR DETECTIVE:\nA student writes “She always is late and she go cycling twice a week.”\nWhich revision is grammatically correct?", "a": "She is always late and she goes cycling twice a week.", "options": ["She is always late and she goes cycling twice a week.", "She always is late and she goes cycling twice a week.", "She is always late and she go cycling twice a week.", "She is always late and she goes cycling twice a weeks."], "why": "Be + always; she goes; twice a week."}];let level=0,items=[],index=0,score=0,locked=false;const $=id=>document.getElementById(id);function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function start(l){level=l;document.querySelectorAll('.level').forEach((b,i)=>b.classList.toggle('active',i===l));items=shuffle(all.slice(l*6,l*6+6)).map(x=>({...x,options:shuffle(x.options)}));index=0;score=0;$('finish').classList.add('hidden');$('welcome').classList.add('hidden');$('levels').classList.add('hidden');$('gameTop').style.display='flex';$('progressBar').style.display='block';$('play').classList.remove('hidden');render()}function render(){locked=false;let x=items[index];$('counter').textContent=`Question ${index+1} / ${items.length}`;$('score').textContent=`⭐ ${score} / ${items.length*10}`;$('label').textContent=['Easy','Medium','Hard · Skill-based'][level];$('fill').style.width=(index/items.length*100)+'%';$('progressBar').setAttribute('aria-valuenow',String(Math.round(index/items.length*100)));$('question').textContent=x.q;$('feedback').textContent='';$('next').classList.add('hidden');$('choices').replaceChildren();x.options.forEach(o=>{let b=document.createElement('button');b.textContent=o;b.onclick=()=>choose(b,o);$('choices').append(b)})}function choose(btn,o){if(locked)return;locked=true;let x=items[index],ok=o===x.a;if(ok)score+=10;document.querySelectorAll('#choices button').forEach(b=>{b.disabled=true;if(b.textContent===x.a)b.classList.add('correct');else if(b===btn)b.classList.add('wrong')});$('feedback').textContent=(ok?'✅ Correct! +10 points':'❌ Correct answer: '+x.a)+'\n💡 '+x.why;$('score').textContent=`⭐ ${score} / ${items.length*10}`;$('next').textContent=index===items.length-1?'See results →':'Next question →';$('next').classList.remove('hidden')}$('next').onclick=()=>{index++;if(index>=items.length){$('play').classList.add('hidden');$('finish').classList.remove('hidden');$('fill').style.width='100%';$('progressBar').setAttribute('aria-valuenow','100');$('badge').textContent=score===60?'🥇 GOLD CHAMPION':score>=40?'🥈 SILVER STAR':score>=20?'🥉 BRONZE EXPLORER':'🌱 BRAVE BEGINNER';$('result').textContent=score>=50?'🏆 Excellent!':score>=30?'🌟 Good job!':'💪 Keep practising!';$('summary').textContent=`${['Easy','Medium','Hard'][level]} level: ${score} / ${items.length*10} points.`}else render()};document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{level=Number(b.dataset.level);document.querySelectorAll('.level').forEach((el,i)=>el.classList.toggle('active',i===level));});$('begin').onclick=()=>start(level);$('again').onclick=()=>start(level);$('change-level').onclick=()=>{$('finish').classList.add('hidden');$('play').classList.add('hidden');$('welcome').classList.remove('hidden');$('levels').classList.remove('hidden');$('gameTop').style.display='none';$('progressBar').style.display='none';};$('finish').classList.add('hidden');
</script></body></html>
